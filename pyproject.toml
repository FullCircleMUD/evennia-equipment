[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-equipment"
version = "0.0.1"
description = "Wearslots, worn/wielded equipment and carrying capacity for Evennia characters."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "equipment", "inventory", "wearslots", "encumbrance"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
    # Every line the library emits goes to its own equipment.log; the
    # mechanism belongs to the extension, log.py only names the file.
    "evennia-logging-extension",
    # Every walk over an object's contents goes through walk_contents, so one
    # definition of a filter serves every call site that needs it.
    "evennia-targeting",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-equipment"
Repository = "https://github.com/FullCircleMUD/evennia-equipment"
Issues = "https://github.com/FullCircleMUD/evennia-equipment/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_equipment*"]
